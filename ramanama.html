      <div class="prog" id="nowProg" hidden><i id="nowBar"></i></div>
      <div class="gstats" id="gstats"></div>
    </div>

    <!-- My contribution / offer your voice -->
    <div class="card" id="cardMe">
      <h2 id="t_offerH"></h2>
      <div class="who" id="who" hidden></div>

      <!-- not signed in -->
      <div id="vSignin" hidden>
        <div id="t_signinNote"></div>
        <div id="gbtn" style="margin-top:12px;display:flex;justify-content:center;min-height:44px"></div>
        <div class="msg" id="signMsg"></div>
      </div>

      <!-- registration -->
      <div id="vReg" hidden>
        <label class="lbl" id="t_name" for="fName"></label>
        <input type="text" id="fName" maxlength="60" autocomplete="name">
        <label class="lbl" id="t_mobile" for="fMobile"></label>
        <input type="tel" id="fMobile" autocomplete="tel">
        <label class="lbl" id="t_country" for="fCountry"></label>
        <select id="fCountry"></select>
        <label class="chk"><input type="checkbox" id="fAnon"><span id="t_anon"></span></label>
        <button class="big" id="bReg"></button>
        <div class="msg" id="regMsg"></div>
      </div>

      <div id="vStatus" hidden>
        <div class="status" id="stLine"></div>
        <div class="ok" id="stThanks" hidden></div>
        <div id="stReason" class="warn" hidden></div>
        <audio id="myAudio" controls preload="none" hidden></audio>
        <div class="stats" id="stPlays" hidden></div>
        <button class="btn2 red" id="bWithdraw" hidden></button>
        <div class="confirm" id="wConfirm" hidden>
          <div id="t_wSure"></div>
          <button class="btn2 red" id="bWYes"></button><button class="btn2" id="bWNo"></button>
        </div>
      </div>

      <!-- recorder -->
      <div id="vRec" hidden>
        <span class="lbl" id="t_howMany"></span>
        <div class="opts" id="tgts">
          <button data-n="18" class="on">18</button><button data-n="36">36</button><button data-n="108">108</button>
        </div>
        <span class="lbl" id="t_pace"></span>
        <div class="opts" id="paces">
          <button data-p="1.5"><span class="pn"></span><small>1.5 s</small></button>
          <button data-p="1.2" class="on"><span class="pn"></span><small>1.2 s</small></button>
          <button data-p="0.9"><span class="pn"></span><small>0.9 s</small></button>
        </div>
        <div class="stage" id="stage">

          <div class="circle" id="circle"></div>
          <div class="pbar"><i id="pb"></i></div>
          <div class="meter"><i id="lvl"></i></div>
          <div class="msg" id="recMsg"></div>
          <button class="big" id="bGo"></button>
        </div>
        <div class="note" id="t_recNote"></div>

          <audio id="revAudio" controls></audio>
          <div class="msg" id="revMsg"></div>
          <label class="chk"><input type="checkbox" id="fConsent"><span id="t_consent"></span></label>
          <button class="big" id="bSubmit" disabled></button>
          <button class="btn2" id="bAgain"></button>
          <div class="msg" id="subMsg"></div>
        </div>
      </div>
    </div>

      <h2 id="t_teachH"></h2>
      <div id="teachBody"></div>
      <div class="credit" id="t_teachCredit"></div>
    </div>

    <div class="card" id="cardFaq">
      <h2 id="t_faqH"></h2>
      <div id="faqBody"></div>
    </div>
  </div>

  <div id="footer"></div>

  TEACH.te = [["రెండు తారక నామాలు", "జనన మరణ సాగరాన్ని దాటించే తారక మంత్రాలు రెండు – ప్రణవం (ఓం) మరియు రామ నామం అని పెరియవా ఉపదేశించారు. ఓంకారాన్ని కఠిన నియమాలతో జపిస్తారు; రామ నామాన్ని మాత్రం ఎవరైనా, ఎప్పుడైనా, ఎక్కడైనా జపించవచ్చు."], ["ముందు ఓం అవసరం లేదు", "చాలా మంత్రాలు 'ఓం'తో ప్రారంభమవుతాయి. రామ నామానికి ముందు ఓం అవసరం లేదు; అయినా అది తనంతట తానే సంపూర్ణ మంత్రం. 'రామ' అంటే చాలు."], ["కలియుగ శరణం", "విస్తృత అనుష్ఠానాలు కష్టమైన ఈ కలియుగంలో, భగవన్నామ జపమే సులభమైన, నిశ్చితమైన మార్గం. రామ నామం దుఃఖాన్ని పోగొడుతుంది, మనస్సును శుద్ధి చేస్తుంది, ఇహంలో శ్రేయస్సును, పరంలో మోక్షాన్ని ప్రసాదిస్తుంది."], ["తుక్కిరి పాట్టి", "చిన్నతనంలోనే భర్తను కోల్పోయిన ఒక స్త్రీని ఊరివారు దూరం పెట్టి 'తుక్కిరి' (దురదృష్టవంతురాలు) అని పిలిచేవారని పెరియవా చెప్పారు. ఎలాంటి చేదు భావం లేకుండా ఆమె రోజంతా రామ నామమే జపిస్తూ ఉండేది. ఒకరోజు భరించలేని కడుపు నొప్పితో ఒక బాలుడు ఆమె ఇంటికి వచ్చాడు; ఆమె చిటికెడు విభూతిపై రామ నామం జపించి అతని నుదుటన పెట్టింది – నొప్పి వెంటనే తగ్గిపోయింది. ఆమెను దూరం పెట్టిన అదే ఊరు, ఆ రోజు నుండి ఆమెను 'రామ నామ పాట్టి' అని పూజించింది. ఇదే నామ మహిమ."], ["రామ నామం – మనస్సుకు ఔషధం", "రామ నామం జపించడం, వినడం మనస్సును శాంతపరుస్తుంది, భయాన్ని, దుఃఖాన్ని తగ్గిస్తుంది, చుట్టూ ఉన్నవారికీ శాంతినిస్తుంది."], ["అనేక స్వరాలు, ఒకే నామం", "ప్రపంచవ్యాప్తంగా ఉన్న భక్తుల స్వరాల్లో రామ నామం నిరంతరం వినిపిస్తున్నప్పుడు, ఆ ప్రదేశం శాంతితో, శుభ ప్రకంపనలతో నిండిపోతుంది. ఇంట్లో, పూజ గదిలో, పని ప్రదేశంలో వినిపించనివ్వండి."]];
  FAQ.te = [["ఈ పేజీ ఏమిటి?", "ప్రపంచవ్యాప్తంగా ఉన్న భక్తుల స్వరాల్లో రామ నామాన్ని భద్రపరిచే బ్యాంకు ఇది. ఆమోదించబడిన ప్రతి స్వరం ఒకే నిరంతర ప్రవాహంలో చేరి, అంతులేకుండా వినిపిస్తూ ఉంటుంది."], ["ఎలా వినాలి?", "▶ నొక్కండి. స్వరాలు ఒకదాని తర్వాత ఒకటి, మారుతూ, నిరంతరం వినిపిస్తాయి. ఇంట్లో, పూజ గదిలో లేదా పని ప్రదేశంలో వినిపించనివ్వండి."], ["నా స్వరాన్ని ఎలా సమర్పించాలి?", "క్రింద Google ద్వారా సైన్ ఇన్ చేసి ఒక్కసారి నమోదు చేయండి. 18, 36 లేదా 108 ఎంచుకుని, వృత్తం వెలిగినప్పుడల్లా 'రామ' అనండి. విని, సమర్పించండి."], ["ఒకటి కంటే ఎక్కువ సార్లు సమర్పించవచ్చా?", "ప్రతి భక్తుడు ఒక్కసారి మాత్రమే. సమర్పించే ముందు ఎన్నిసార్లైనా మళ్ళీ రికార్డ్ చేయవచ్చు. మీ రికార్డింగ్ ఆమోదించబడకపోతే, మళ్ళీ రికార్డ్ చేసే సౌకర్యం దానంతట అదే తెరుచుకుంటుంది."], ["రికార్డింగ్‌లను ఎవరు పరిశీలిస్తారు?", "స్వచ్ఛంద సేవకులు, రికార్డింగ్‌లో రామ నామం మాత్రమే ఉంది, మరేమీ లేదు అని మాత్రమే విని నిర్ధారిస్తారు. సంఖ్యను లెక్కించరు – మీ భక్తియే ముఖ్యం."], ["నా స్వరం ఎక్కడ వినిపిస్తుంది?", "ప్రపంచంలో ఎక్కడైనా, ఎప్పుడైనా – ఈ పేజీలో, భవిష్యత్తులో ఆలయాల్లో కూడా. వినిపించేటప్పుడు మీ పేరు (లేదా మీరు కోరుకుంటే 'ఒక భక్తుడు') మరియు దేశం చూపబడతాయి. మీ ఈమెయిల్, మొబైల్ నంబర్ ఎప్పుడూ చూపబడవు."], ["నా స్వరం ఎన్నిసార్లు వినిపించిందో ఎలా తెలుసుకోవాలి?", "సైన్ ఇన్ చేస్తే, 'నా సమర్పణ' విభాగంలో ఎన్నిసార్లు, ఎన్ని దేశాల్లో వినిపించిందో చూడవచ్చు."], ["నా రికార్డింగ్‌ను తొలగించవచ్చా?", "అవును – 'నా సమర్పణ' లో 'నా రికార్డింగ్‌ను వెనక్కి తీసుకోండి' నొక్కితే తొలగించబడుతుంది."], ["ఏదైనా రుసుము ఉందా?", "లేదు. పూర్తిగా ఉచితం, ప్రకటనలు లేవు."]];

  TEACH.kn = [["ಎರಡು ತಾರಕ ನಾಮಗಳು", "ಜನನ ಮರಣ ಸಾಗರವನ್ನು ದಾಟಿಸುವ ತಾರಕ ಮಂತ್ರಗಳು ಎರಡು – ಪ್ರಣವ (ಓಂ) ಮತ್ತು ರಾಮ ನಾಮ ಎಂದು ಪೆರಿಯವರು ಉಪದೇಶಿಸಿದರು. ಓಂಕಾರವನ್ನು ಕಟ್ಟುನಿಟ್ಟಾದ ನಿಯಮಗಳೊಂದಿಗೆ ಜಪಿಸಲಾಗುತ್ತದೆ; ರಾಮ ನಾಮವನ್ನು ಮಾತ್ರ ಯಾರು ಬೇಕಾದರೂ, ಯಾವಾಗ ಬೇಕಾದರೂ, ಎಲ್ಲಿ ಬೇಕಾದರೂ ಜಪಿಸಬಹುದು."], ["ಮೊದಲು ಓಂ ಬೇಕಿಲ್ಲ", "ಹೆಚ್ಚಿನ ಮಂತ್ರಗಳು 'ಓಂ' ನಿಂದ ಪ್ರಾರಂಭವಾಗುತ್ತವೆ. ರಾಮ ನಾಮಕ್ಕೆ ಮೊದಲು ಓಂ ಬೇಕಿಲ್ಲ; ಆದರೂ ಅದು ತಾನೇ ಸಂಪೂರ್ಣ ಮಂತ್ರ. 'ರಾಮ' ಎಂದರೆ ಸಾಕು."], ["ಕಲಿಯುಗದ ಆಶ್ರಯ", "ವಿಸ್ತಾರವಾದ ಅನುಷ್ಠಾನಗಳು ಕಷ್ಟಕರವಾದ ಈ ಕಲಿಯುಗದಲ್ಲಿ, ಭಗವನ್ನಾಮ ಜಪವೇ ಸರಳವಾದ, ನಿಶ್ಚಿತವಾದ ಮಾರ್ಗ. ರಾಮ ನಾಮ ದುಃಖವನ್ನು ದೂರ ಮಾಡುತ್ತದೆ, ಮನಸ್ಸನ್ನು ಶುದ್ಧಗೊಳಿಸುತ್ತದೆ, ಇಹದಲ್ಲಿ ಶ್ರೇಯಸ್ಸನ್ನೂ ಪರದಲ್ಲಿ ಮೋಕ್ಷವನ್ನೂ ಕರುಣಿಸುತ್ತದೆ."], ["ತುಕ್ಕಿರಿ ಪಾಟ್ಟಿ", "ಬಾಲ್ಯದಲ್ಲೇ ಪತಿಯನ್ನು ಕಳೆದುಕೊಂಡ ಒಬ್ಬ ಸ್ತ್ರೀಯನ್ನು ಊರಿನವರು ದೂರವಿಟ್ಟು 'ತುಕ್ಕಿರಿ' (ದುರದೃಷ್ಟವಂತೆ) ಎಂದು ಕರೆಯುತ್ತಿದ್ದರು ಎಂದು ಪೆರಿಯವರು ಹೇಳಿದರು. ಯಾವ ಕಹಿಯೂ ಇಲ್ಲದೆ ಆಕೆ ದಿನವಿಡೀ ರಾಮ ನಾಮವನ್ನೇ ಜಪಿಸುತ್ತಿದ್ದಳು. ಒಂದು ದಿನ ಸಹಿಸಲಾಗದ ಹೊಟ್ಟೆನೋವಿನಿಂದ ಒಬ್ಬ ಬಾಲಕ ಆಕೆಯ ಮನೆಗೆ ಬಂದ; ಆಕೆ ಚಿಟಿಕೆ ವಿಭೂತಿಯ ಮೇಲೆ ರಾಮ ನಾಮ ಜಪಿಸಿ ಅವನ ಹಣೆಗೆ ಹಚ್ಚಿದಳು – ನೋವು ತಕ್ಷಣ ಮಾಯವಾಯಿತು. ಆಕೆಯನ್ನು ದೂರವಿಟ್ಟಿದ್ದ ಅದೇ ಊರು, ಅಂದಿನಿಂದ ಆಕೆಯನ್ನು 'ರಾಮ ನಾಮ ಪಾಟ್ಟಿ' ಎಂದು ಪೂಜಿಸಿತು. ಇದೇ ನಾಮದ ಮಹಿಮೆ."], ["ರಾಮ ನಾಮ – ಮನಸ್ಸಿಗೆ ಔಷಧ", "ರಾಮ ನಾಮವನ್ನು ಜಪಿಸುವುದು ಮತ್ತು ಕೇಳುವುದು ಮನಸ್ಸನ್ನು ಶಾಂತಗೊಳಿಸುತ್ತದೆ, ಭಯ ಮತ್ತು ದುಃಖವನ್ನು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ, ಸುತ್ತಲಿನವರಿಗೂ ಶಾಂತಿ ನೀಡುತ್ತದೆ."], ["ಅನೇಕ ಧ್ವನಿಗಳು, ಒಂದೇ ನಾಮ", "ಜಗತ್ತಿನಾದ್ಯಂತದ ಭಕ್ತರ ಧ್ವನಿಗಳಲ್ಲಿ ರಾಮ ನಾಮ ನಿರಂತರವಾಗಿ ಕೇಳಿಸುವಾಗ, ಆ ಸ್ಥಳ ಶಾಂತಿ ಮತ್ತು ಶುಭ ಕಂಪನಗಳಿಂದ ತುಂಬುತ್ತದೆ. ಮನೆಯಲ್ಲಿ, ದೇವರ ಕೋಣೆಯಲ್ಲಿ, ಕೆಲಸದ ಸ್ಥಳದಲ್ಲಿ ಕೇಳಿಸಲಿ."]];
  FAQ.kn = [["ಈ ಪುಟ ಏನು?", "ಜಗತ್ತಿನಾದ್ಯಂತದ ಭಕ್ತರ ಧ್ವನಿಗಳಲ್ಲಿ ರಾಮ ನಾಮವನ್ನು ಸಂಗ್ರಹಿಸುವ ಬ್ಯಾಂಕ್ ಇದು. ಅಂಗೀಕರಿಸಲಾದ ಪ್ರತಿಯೊಂದು ಧ್ವನಿಯೂ ಒಂದೇ ನಿರಂತರ ಪ್ರವಾಹದಲ್ಲಿ ಸೇರಿ, ಕೊನೆಯಿಲ್ಲದೆ ಕೇಳಿಸುತ್ತಲೇ ಇರುತ್ತದೆ."], ["ಹೇಗೆ ಕೇಳುವುದು?", "▶ ಒತ್ತಿ. ಧ್ವನಿಗಳು ಒಂದರ ನಂತರ ಒಂದು, ಬದಲಾಗುತ್ತಾ, ನಿರಂತರವಾಗಿ ಕೇಳಿಸುತ್ತವೆ. ಮನೆಯಲ್ಲಿ, ದೇವರ ಕೋಣೆಯಲ್ಲಿ ಅಥವಾ ಕೆಲಸದ ಸ್ಥಳದಲ್ಲಿ ಕೇಳಿಸಲಿ."], ["ನನ್ನ ಧ್ವನಿಯನ್ನು ಹೇಗೆ ಸಮರ್ಪಿಸುವುದು?", "ಕೆಳಗೆ Google ಮೂಲಕ ಸೈನ್ ಇನ್ ಮಾಡಿ ಒಮ್ಮೆ ನೋಂದಾಯಿಸಿ. 18, 36 ಅಥವಾ 108 ಆಯ್ಕೆ ಮಾಡಿ, ವೃತ್ತ ಬೆಳಗಿದಾಗಲೆಲ್ಲ 'ರಾಮ' ಎನ್ನಿ. ಕೇಳಿ, ಸಮರ್ಪಿಸಿ."], ["ಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಾರಿ ಸಮರ್ಪಿಸಬಹುದೇ?", "ಪ್ರತಿ ಭಕ್ತರೂ ಒಮ್ಮೆ ಮಾತ್ರ. ಸಮರ್ಪಿಸುವ ಮೊದಲು ಎಷ್ಟು ಬಾರಿ ಬೇಕಾದರೂ ಮತ್ತೆ ರೆಕಾರ್ಡ್ ಮಾಡಬಹುದು. ನಿಮ್ಮ ರೆಕಾರ್ಡಿಂಗ್ ಅಂಗೀಕೃತವಾಗದಿದ್ದರೆ, ಮತ್ತೆ ರೆಕಾರ್ಡ್ ಮಾಡುವ ಸೌಲಭ್ಯ ತಾನಾಗಿಯೇ ತೆರೆಯುತ್ತದೆ."], ["ರೆಕಾರ್ಡಿಂಗ್‌ಗಳನ್ನು ಯಾರು ಪರಿಶೀಲಿಸುತ್ತಾರೆ?", "ಸ್ವಯಂಸೇವಕರು, ರೆಕಾರ್ಡಿಂಗ್‌ನಲ್ಲಿ ರಾಮ ನಾಮ ಮಾತ್ರ ಇದೆ, ಬೇರೇನೂ ಇಲ್ಲ ಎಂಬುದನ್ನು ಮಾತ್ರ ಕೇಳಿ ಖಚಿತಪಡಿಸುತ್ತಾರೆ. ಸಂಖ್ಯೆಯನ್ನು ಪರಿಶೀಲಿಸುವುದಿಲ್ಲ – ನಿಮ್ಮ ಭಕ್ತಿಯೇ ಮುಖ್ಯ."], ["ನನ್ನ ಧ್ವನಿ ಎಲ್ಲಿ ಕೇಳಿಸುತ್ತದೆ?", "ಜಗತ್ತಿನ ಎಲ್ಲಿಯಾದರೂ, ಯಾವಾಗಲಾದರೂ – ಈ ಪುಟದಲ್ಲಿ, ಮುಂದೆ ದೇವಾಲಯಗಳಲ್ಲೂ. ಕೇಳಿಸುವಾಗ ನಿಮ್ಮ ಹೆಸರು (ಅಥವಾ ನೀವು ಬಯಸಿದರೆ 'ಒಬ್ಬ ಭಕ್ತ') ಮತ್ತು ದೇಶ ತೋರಿಸಲಾಗುತ್ತದೆ. ನಿಮ್ಮ ಇಮೇಲ್ ಮತ್ತು ಮೊಬೈಲ್ ಸಂಖ್ಯೆಯನ್ನು ಎಂದಿಗೂ ತೋರಿಸುವುದಿಲ್ಲ."], ["ನನ್ನ ಧ್ವನಿ ಎಷ್ಟು ಬಾರಿ ಕೇಳಿಸಿದೆ ಎಂದು ಹೇಗೆ ತಿಳಿಯುವುದು?", "ಸೈನ್ ಇನ್ ಮಾಡಿದರೆ, 'ನನ್ನ ಸಮರ್ಪಣೆ' ವಿಭಾಗದಲ್ಲಿ ಎಷ್ಟು ಬಾರಿ, ಎಷ್ಟು ದೇಶಗಳಲ್ಲಿ ಕೇಳಿಸಿದೆ ಎಂದು ನೋಡಬಹುದು."], ["ನನ್ನ ರೆಕಾರ್ಡಿಂಗ್ ಅಳಿಸಬಹುದೇ?", "ಹೌದು – 'ನನ್ನ ಸಮರ್ಪಣೆ' ಯಲ್ಲಿ 'ನನ್ನ ರೆಕಾರ್ಡಿಂಗ್ ಹಿಂಪಡೆಯಿರಿ' ಒತ್ತಿದರೆ ಅಳಿಸಲಾಗುತ್ತದೆ."], ["ಯಾವುದಾದರೂ ಶುಲ್ಕ ಇದೆಯೇ?", "ಇಲ್ಲ. ಸಂಪೂರ್ಣ ಉಚಿತ, ಜಾಹೀರಾತುಗಳಿಲ್ಲ."]];

: "കാരണം: {r}", "plays": "{p} തവണ കേട്ടു · {c} രാജ്യങ്ങൾ · ആകെ {n} രാമ നാമം · ഇന്ന് {t} തവണ", "withdraw": "എന്റെ റെക്കോർഡിംഗ് പിൻവലിക്കുക", "wSure": "ഉറപ്പാണോ? നിങ്ങളുടെ റെക്കോർഡിംഗ് നീക്കം ചെയ്യപ്പെടും.", "yes": "അതെ, നീക്കുക", "no": "വേണ്ട", "errGen": "എന്തോ പിശക് സംഭവിച്ചു. അൽപ്പസമയം കഴിഞ്ഞ് ശ്രമിക്കുക.", "signAgain": "ദയവായി വീണ്ടും സൈൻ ഇൻ ചെയ്യുക.", "pmH": "രാം എന്നാൽ എന്ത് – ഭാരതത്തിന്റെ നമ്മുടെ ബഹുമാനപ്പെട്ട പ്രധാനമന്ത്രിയുടെ വാക്കുകളിൽ", "taraka": "രാമ നാമം തന്നെ താരക മന്ത്രം – ജനന മരണ സാഗരം കടത്തുന്ന നാമം. ജപിച്ചാലും, കേട്ടാലും, സ്മരിച്ചാലും മതി.", "listenSub": "ലോകമെങ്ങുമുള്ള ഭക്തരുടെ ശബ്ദങ്ങൾ – ഒന്നിനു പിറകെ ഒന്നായി, ഇടതടവില്ലാതെ.", "play": "കേൾക്കൂ", "pause": "നിർത്തുക", "devotee": "ഒരു ഭക്തൻ", "idle": "▶ അമർത്തുക – ഭക്തരുടെ ശബ്ദങ്ങൾ തുടർച്ചയായി മുഴങ്ങും.", "empty": "ഇതുവരെ ശബ്ദങ്ങൾ ചേർന്നിട്ടില്ല – താഴെ ആദ്യമായി നിങ്ങളുടെ ശബ്ദം സമർപ്പിക്കൂ.", "loading": "ലോഡ് ചെയ്യുന്നു…", "netErr": "കണക്ഷൻ പ്രശ്നം – വീണ്ടും ▶ അമർത്തുക.", "nowNo": "{no} · {n} രാമ", "gs": "ബാങ്കിൽ {v} ശബ്ദങ്ങൾ · {c} രാജ്യങ്ങൾ · {n} രാമ നാമം", "gsToday": "ഇന്ന് {p} തവണ മുഴങ്ങി · {lc} രാജ്യങ്ങളിൽ കേട്ടു", "teachH": "രാമ നാമം – ശ്രീ മഹാ പെരിയവയുടെ ഉപദേശങ്ങൾ", "teachCredit": "ശ്രീ മഹാ പെരിയവയുടെ പ്രഭാഷണങ്ങളെ ആധാരമാക്കി.", "faqH": "പതിവായി ചോദിക്കുന്ന ചോദ്യങ്ങൾ"};
  TEACH.ml = [["രണ്ട് താരക നാമങ്ങൾ", "ജനന മരണ സാഗരം കടത്തുന്ന താരക മന്ത്രങ്ങൾ രണ്ടാണ് – പ്രണവം (ഓം), രാമ നാമം എന്ന് പെരിയവ ഉപദേശിച്ചു. ഓംകാരം കർശന നിയമങ്ങളോടെ ജപിക്കുന്നതാണ്; എന്നാൽ രാമ നാമം ആർക്കും, എപ്പോഴും, എവിടെയും ജപിക്കാം."], ["മുന്നിൽ ഓം വേണ്ട", "മിക്ക മന്ത്രങ്ങളും 'ഓം' കൊണ്ട് തുടങ്ങുന്നു. രാമ നാമത്തിനു മുന്നിൽ ഓം വേണ്ട; എങ്കിലും അത് സ്വയം സമ്പൂർണ മന്ത്രമാണ്. 'രാമ' എന്ന് പറഞ്ഞാൽ മതി."], ["കലിയുഗത്തിലെ ആശ്രയം", "വിപുലമായ അനുഷ്ഠാനങ്ങൾ പ്രയാസമായ ഈ കലിയുഗത്തിൽ, ഭഗവന്നാമ ജപമാണ് ഏറ്റവും ലളിതവും ഉറപ്പുള്ളതുമായ വഴി. രാമ നാമം ദുഃഖം അകറ്റുന്നു, മനസ്സിനെ ശുദ്ധമാക്കുന്നു, ഇഹത്തിൽ ശ്രേയസ്സും പരത്തിൽ മോക്ഷവും നൽകുന്നു."], ["തുക്കിരി പാട്ടി", "ചെറുപ്രായത്തിൽ തന്നെ ഭർത്താവിനെ നഷ്ടപ്പെട്ട ഒരു സ്ത്രീയെ നാട്ടുകാർ അകറ്റിനിർത്തി 'തുക്കിരി' (ഭാഗ്യമില്ലാത്തവൾ) എന്ന് വിളിച്ചിരുന്നു എന്ന് പെരിയവ പറഞ്ഞു. ഒരു കയ്പും ഇല്ലാതെ അവർ ദിവസം മുഴുവൻ രാമ നാമം തന്നെ ജപിച്ചുകൊണ്ടിരുന്നു. ഒരു ദിവസം സഹിക്കാനാവാത്ത വയറുവേദനയുമായി ഒരു ബാലൻ അവരുടെ വീട്ടിൽ വന്നു; ഒരു നുള്ള് ഭസ്മത്തിൽ രാമ നാമം ജപിച്ച് അവർ അവന്റെ നെറ്റിയിൽ തൊടുവിച്ചു – വേദന ഉടനെ മാറി. അവരെ അകറ്റിനിർത്തിയ അതേ നാട്, അന്നു മുതൽ അവരെ 'രാമ നാമ പാട്ടി' എന്ന് ആദരിച്ചു. ഇതാണ് നാമത്തിന്റെ മഹിമ."], ["രാമ നാമം – മനസ്സിനുള്ള ഔഷധം", "രാമ നാമം ജപിക്കുന്നതും കേൾക്കുന്നതും മനസ്സിനെ ശാന്തമാക്കുന്നു, ഭയവും ദുഃഖവും കുറയ്ക്കുന്നു, ചുറ്റുമുള്ളവർക്കും ശാന്തി നൽകുന്നു."], ["അനേകം ശബ്ദങ്ങൾ, ഒരേ നാമം", "ലോകമെങ്ങുമുള്ള ഭക്തരുടെ ശബ്ദങ്ങളിൽ രാമ നാമം ഇടതടവില്ലാതെ മുഴങ്ങുമ്പോൾ, ആ ഇടം ശാന്തിയും ശുഭ സ്പന്ദനങ്ങളും കൊണ്ട് നിറയുന്നു. വീട്ടിലും, പൂജാമുറിയിലും, ജോലിസ്ഥലത്തും മുഴങ്ങട്ടെ."]];
  FAQ.ml = [["ഈ പേജ് എന്താണ്?", "ലോകമെങ്ങുമുള്ള ഭക്തരുടെ ശബ്ദങ്ങളിൽ രാമ നാമം സൂക്ഷിക്കുന്ന ബാങ്കാണ് ഇത്. അംഗീകരിച്ച ഓരോ ശബ്ദവും ഒരേ തുടർധാരയിൽ ചേർന്ന്, അവസാനമില്ലാതെ മുഴങ്ങിക്കൊണ്ടിരിക്കും."], ["എങ്ങനെ കേൾക്കാം?", "▶ അമർത്തുക. ശബ്ദങ്ങൾ ഒന്നിനു പിറകെ ഒന്നായി, മാറിമാറി, തുടർച്ചയായി മുഴങ്ങും. വീട്ടിലോ പൂജാമുറിയിലോ ജോലിസ്ഥലത്തോ മുഴങ്ങട്ടെ."], ["എന്റെ ശബ്ദം എങ്ങനെ സമർപ്പിക്കാം?", "താഴെ Google വഴി സൈൻ ഇൻ ചെയ്ത് ഒരിക്കൽ രജിസ്റ്റർ ചെയ്യുക. 18, 36 അല്ലെങ്കിൽ 108 തിരഞ്ഞെടുത്ത്, വൃത്തം തിളങ്ങുമ്പോഴെല്ലാം 'രാമ' എന്ന് പറയുക. കേട്ടുനോക്കി സമർപ്പിക്കുക."], ["ഒന്നിലധികം തവണ സമർപ്പിക്കാമോ?", "ഓരോ ഭക്തനും ഒരിക്കൽ മാത്രം. സമർപ്പിക്കുന്നതിനു മുമ്പ് എത്ര തവണ വേണമെങ്കിലും വീണ്ടും റെക്കോർഡ് ചെയ്യാം. നിങ്ങളുടെ റെക്കോർഡിംഗ് അംഗീകരിക്കപ്പെട്ടില്ലെങ്കിൽ, വീണ്ടും റെക്കോർഡ് ചെയ്യാനുള്ള സൗകര്യം തനിയെ തുറക്കും."], ["റെക്കോർഡിംഗുകൾ ആരാണ് പരിശോധിക്കുന്നത്?", "സന്നദ്ധ സേവകർ, റെക്കോർഡിംഗിൽ രാമ നാമം മാത്രമേ ഉള്ളൂ, മറ്റൊന്നുമില്ല എന്ന് മാത്രം കേട്ട് ഉറപ്പാക്കുന്നു. എണ്ണം പരിശോധിക്കുന്നില്ല – നിങ്ങളുടെ ഭക്തിയാണ് പ്രധാനം."], ["എന്റെ ശബ്ദം എവിടെ മുഴങ്ങും?", "ലോകത്ത് എവിടെയും, എപ്പോഴും – ഈ പേജിൽ, ഭാവിയിൽ ക്ഷേത്രങ്ങളിലും. മുഴങ്ങുമ്പോൾ നിങ്ങളുടെ പേരും (അല്ലെങ്കിൽ നിങ്ങൾ ആഗ്രഹിച്ചാൽ 'ഒരു ഭക്തൻ') രാജ്യവും കാണിക്കും. നിങ്ങളുടെ ഇമെയിലും മൊബൈൽ നമ്പറും ഒരിക്കലും കാണിക്കില്ല."], ["എന്റെ ശബ്ദം എത്ര തവണ മുഴങ്ങി എന്ന് എങ്ങനെ അറിയാം?", "സൈൻ ഇൻ ചെയ്താൽ, 'എന്റെ സമർപ്പണം' ഭാഗത്ത് എത്ര തവണ, എത്ര രാജ്യങ്ങളിൽ മുഴങ്ങി എന്ന് കാണാം."], ["എന്റെ റെക്കോർഡിംഗ് നീക്കം ചെയ്യാമോ?", "ഉവ്വ് – 'എന്റെ സമർപ്പണം' ഭാഗത്ത് 'എന്റെ റെക്കോർഡിംഗ് പിൻവലിക്കുക' അമർത്തിയാൽ നീക്കം ചെയ്യപ്പെടും."], ["എന്തെങ്കിലും ഫീസ് ഉണ്ടോ?", "ഇല്ല. പൂർണ്ണമായും സൗജന്യം, പരസ്യങ്ങളില്ല."]];

  TEACH.gu = [["બે તારક નામ", "પેરિયવાએ ઉપદેશ આપ્યો કે જન્મ-મૃત્યુના સાગરથી પાર ઉતારનાર તારક મંત્ર બે છે – પ્રણવ (ૐ) અને રામ નામ. ૐ નો જપ કડક નિયમો સાથે થાય છે; પણ રામ નામ કોઈ પણ, ક્યારેય પણ, ક્યાંય પણ લઈ શકે છે."], ["આગળ ૐ લગાવવાની જરૂર નથી", "મોટા ભાગના મંત્રો 'ૐ' થી શરૂ થાય છે. રામ નામની આગળ ૐ ની જરૂર નથી; છતાં તે પોતે જ સંપૂર્ણ મંત્ર છે. માત્ર 'રામ' કહેવું પૂરતું છે."], ["કળિયુગનો આશ્રય", "આ કળિયુગમાં, જ્યારે વિસ્તૃત અનુષ્ઠાન કઠિન છે, ભગવન્નામનો જપ જ સૌથી સરળ અને નિશ્ચિત માર્ગ છે. રામ નામ દુઃખ હરે છે, મનને શુદ્ધ કરે છે, આ લોકમાં કલ્યાણ અને પરલોકમાં મોક્ષ આપે છે."], ["તુક્કિરિ પાટ્ટી", "પેરિયવાએ એક એવી સ્ત્રીની કથા કહી જે બાળપણમાં જ વિધવા થઈ ગઈ હતી; ગામલોકોએ તેમને દૂર રાખ્યાં અને 'તુક્કિરિ' (અભાગી) કહેવા લાગ્યા. કોઈ કડવાશ વિના તેઓ આખો દિવસ રામ નામ જપતાં રહ્યાં. એક દિવસ અસહ્ય પેટના દુખાવાથી પીડાતો એક બાળક તેમના દ્વારે આવ્યો; તેમણે ચપટી વિભૂતિ પર રામ નામ જપીને તેના કપાળે લગાવી – દુખાવો તરત જ મટી ગયો. જે ગામે તેમને તરછોડ્યાં હતાં, તે જ ગામ હવે તેમને 'રામ નામ પાટ્ટી' કહીને પૂજવા લાગ્યું. આ જ નામનો મહિમા છે."], ["રામ નામ – મનની ઔષધિ", "રામ નામનો જપ અને શ્રવણ મનને શાંત કરે છે, ભય અને શોક ઓછો કરે છે, અને આસપાસના લોકોને પણ શાંતિ આપે છે."], ["અનેક સ્વર, એક નામ", "જ્યારે વિશ્વભરના ભક્તોના સ્વરમાં રામ નામ નિરંતર વાગે છે, ત્યારે તે સ્થાન શાંતિ અને શુભ સ્પંદનોથી ભરાઈ જાય છે. તેને ઘરમાં, પૂજાઘરમાં, કાર્યસ્થળે વાગવા દો."]];
  FAQ.gu = [["આ પૃષ્ઠ શું છે?", "આ વિશ્વભરના ભક્તોના સ્વરમાં રામ નામની બેંક છે. સ્વીકૃત દરેક સ્વર એક જ નિરંતર ધારામાં જોડાય છે, જે અટક્યા વિના વાગતી રહે છે."], ["કેવી રીતે સાંભળવું?", "▶ દબાવો. સ્વર એક પછી એક, બદલાતા, સતત વાગશે. ઘરમાં, પૂજાઘરમાં કે કાર્યસ્થળે વાગવા દો."], ["મારો સ્વર કેવી રીતે અર્પણ કરું?", "નીચે Google થી સાઇન ઇન કરો અને એક વાર નોંધણી કરો. 18, 36 કે 108 પસંદ કરો અને વર્તુળ ચમકે ત્યારે દર વખતે 'રામ' બોલો. સાંભળીને અર્પણ કરો."], ["શું એક કરતાં વધુ વાર અર્પણ કરી શકાય?", "દરેક ભક્ત માત્ર એક વાર. અર્પણ કરતાં પહેલાં જેટલી વાર ઇચ્છો તેટલી વાર ફરીથી રેકોર્ડ કરી શકો છો. જો તમારું રેકોર્ડિંગ સ્વીકારાય નહીં, તો ફરીથી રેકોર્ડ કરવાની સુવિધા આપમેળે ખૂલી જશે."], ["રેકોર્ડિંગ કોણ ચકાસે છે?", "સ્વયંસેવકો માત્ર એટલું સાંભળીને ખાતરી કરે છે કે રેકોર્ડિંગમાં રામ નામ જ છે, બીજું કંઈ નહીં. ગણતરી ચકાસાતી નથી – તમારી આસ્થા જ મુખ્ય છે."], ["મારો સ્વર ક્યાં વાગશે?", "વિશ્વમાં ક્યાંય પણ, ક્યારેય પણ – આ પૃષ્ઠ પર, અને ભવિષ્યમાં મંદિરોમાં પણ. વાગતી વખતે તમારું નામ (અથવા ઇચ્છો તો 'એક ભક્ત') અને દેશ દેખાશે. તમારો ઇમેઇલ અને મોબાઇલ નંબર ક્યારેય બતાવાતા નથી."], ["મારો સ્વર કેટલી વાર વાગ્યો, કેવી રીતે જાણું?", "સાઇન ઇન કરતાં 'મારું યોગદાન' માં દેખાશે કે કેટલી વાર અને કેટલા દેશોમાં વાગ્યો."], ["શું હું મારું રેકોર્ડિંગ કાઢી શકું?", "હા – 'મારું યોગદાન' માં 'મારું રેકોર્ડિંગ પાછું ખેંચો' દબાવતાં તે કાઢી નાખવામાં આવશે."], ["કોઈ ફી છે?", "ના. સંપૂર્ણપણે નિઃશુલ્ક, કોઈ જાહેરાત નહીં."]];

      if (!j.ok) throw new Error("playlist");
      let items = j.items || [];
      if (!items.length && nextKey < 0 && after > 0) {        // started past the last key: wrap
        const r2 = await fetch(W + "/rn/playlist?limit=50&after=-1"); const j2 = await r2.json(); items = j2.items || []; j.next = j2.next;
      }
      if (items.length) { queue = queue.slice(Math.max(0, qi - 5)); qi = Math.min(qi, 5); queue.push(...items); nextKey = j.next; }
      return items.length;
    })().finally(() => { fetching = null; });
    return fetching;
  }
  function showNow() {
    if (!cur) return;
    $("nowName").textContent = cur.name || t("devotee");
    $("nowCountry").textContent = (flag(cur.country_code) + " " + (cur.country || "")).trim();
    $("nowExtra").textContent = t("nowNo", { no: cur.no, n: cur.count });
  }
  function setBtn() {
    $("bPlay").classList.toggle("on", wantPlay);
    $("pIc").textContent = wantPlay ? "❚❚" : "▶";
    $("pTx").textContent = wantPlay ? t("pause") : t("play");
    if (!cur) { $("nowName").textContent = ""; $("nowCountry").textContent = ""; if (!$("nowExtra").dataset.msg) $("nowExtra").textContent = t("idle"); }
    else showNow();
  }
  function msg(k) { cur = null; $("nowName").textContent = ""; $("nowCountry").textContent = ""; $("nowExtra").textContent = t(k); $("nowExtra").dataset.msg = k; }
  async function advance() {
    clearTimeout(gapTimer);
    if (!wantPlay) return;
    if (qi + 1 >= queue.length) {
      try { if (!(await fetchMore())) { wantPlay = false; msg("empty"); setBtn(); return; } }
      catch (e) { wantPlay = false; msg("netErr"); setBtn(); return; }
      if (qi + 1 >= queue.length) qi = -1;                  // a single round: start again
    }
    cur = queue[++qi]; delete $("nowExtra").dataset.msg;
    showNow();
    bank.src = cur.url;
    $("nowProg").hidden = false; $("nowBar").style.width = "0";
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: t("nama") + " · " + (cur.name || t("devotee")), artist: cur.country || "", album: t("title") });
      } catch (e) {}
    }
    try { await bank.play(); fails = 0; } catch (e) { if (e && e.name === "NotAllowedError") { wantPlay = false; setBtn(); return; } }
    const nx = queue[qi + 1];
    if (nx) { warm.src = nx.url; try { warm.load(); } catch (e) {} }
    else fetchMore().catch(() => {});
  }
  bank.addEventListener("ended", () => {
    if (cur) { pending[cur.id] = (pending[cur.id] || 0) + 1; pendingN++; if (pendingN >= 10) flushPlays(); }
    $("nowBar").style.width = "100%";
    gapTimer = setTimeout(advance, document.hidden ? 0 : 900);
  });
  bank.addEventListener("error", () => {
    if (!wantPlay || !bank.getAttribute("src")) return;
    if (++fails > Math.max(3, queue.length)) { wantPlay = false; msg("netErr"); setBtn(); return; }
    gapTimer = setTimeout(advance, 500);
  });
  bank.addEventListener("timeupdate", () => {
    if (bank.duration > 0) $("nowBar").style.width = (100 * bank.currentTime / bank.duration).toFixed(1) + "%";
  });
  bank.addEventListener("play", () => { $("pmAudio").pause(); $("myAudio").pause(); });
  ["pmAudio", "myAudio"].forEach(id => $(id).addEventListener("play", () => { if (wantPlay) { wantPlay = false; bank.pause(); clearTimeout(gapTimer); setBtn(); } }));

  $("bPlay").onclick = () => {
    if (wantPlay) { wantPlay = false; bank.pause(); clearTimeout(gapTimer); setBtn(); flushPlays(); return; }
    wantPlay = true; setBtn();
    if (cur && bank.getAttribute("src") && !bank.ended && bank.currentTime > 0) { bank.play().catch(() => {}); return; }
    if (!queue.length) { $("nowExtra").textContent = t("loading"); }
    advance();
  };
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("play", () => { if (!wantPlay) $("bPlay").click(); });
      navigator.mediaSession.setActionHandler("pause", () => { if (wantPlay) $("bPlay").click(); });
    } catch (e) {}
  }

  function flushPlays() {
    const plays = Object.entries(pending).map(([id, n]) => ({ id: +id, n }));
    if (!plays.length) return;
    pending = {}; pendingN = 0;
    const body = JSON.stringify({ plays });
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(W + "/rn/plays", new Blob([body], { type: "text/plain" }))) return;
    } catch (e) {}
    fetch(W + "/rn/plays", { method: "POST", headers: { "Content-Type": "text/plain" }, body, keepalive: true }).catch(() => {});
  }
  setInterval(flushPlays, 60000);
  addEventListener("pagehide", flushPlays);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushPlays(); else loadStats(); });

  // ---------------- listening part: live numbers ----------------
  let stats = null, statsAt = 0;
  function renderStats() {
    if (!stats) { $("gstats").textContent = ""; return; }
    const f = n => Number(n || 0).toLocaleString((L === "en" ? "en" : L) + "-IN-u-nu-latn");
    let s = stats.voices ? t("gs", { v: f(stats.voices), c: f(stats.countries), n: f(stats.nama_in_bank) }) : "";
    if (stats.plays_today) s += (s ? " · " : "") + t("gsToday", { p: f(stats.plays_today), lc: f(stats.listener_countries_today) });
    $("gstats").textContent = s;
  }
  async function loadStats() {
    if (Date.now() - statsAt < 55000) return;
    statsAt = Date.now();
    try { const r = await fetch(W + "/rn/stats"); const j = await r.json(); if (j.ok) { stats = j; renderStats(); } } catch (e) {}
  }
  setInterval(() => { if (document.visibilityState === "visible") loadStats(); }, 60000);

  // ---------------- start ----------------
  loadStats();
  $("recMsg").textContent = t("ready");
  applyLang();
  if (token) loadMe(); else renderState();
  waitGoogle(() => {
    renderGoogleButton();
    if (!token && localStorage.getItem("rnSigned") === "1") google.accounts.id.prompt();
  });
})();
</script>
</body>
</html>
