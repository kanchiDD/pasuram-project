<body>
  <div id="header"></div>

  <div id="rnRoot">
    <div class="top langs" id="langs">
      <button data-l="ta">தமிழ்</button>
      <button data-l="hi">हिन्दी</button>
      <button data-l="en">English</button>
    </div>
    <h1 id="t_title"></h1>
    <div class="tag" id="t_tag"></div>

    <!-- Player, PM recording, teachings and FAQ come in the next steps -->
    <div class="card"><h2 id="t_listenH"></h2><div class="soon" id="t_soon"></div></div>

    <!-- My contribution / offer your voice -->
    <div class="card" id="cardMe">
      <h2 id="t_offerH"></h2>
      <div class="who" id="who" hidden></div>

      <!-- not signed in -->
      <div id="vSignin" hidden>
        <div id="t_signinNote"></div>
        <div id="gbtn" style="margin-top:12px;display:flex;justify-content:center;min-height:44px"></div>
        <div class="msg" id="signMsg"></div>
      </div>

      <!-- registration -->
      <div id="vReg" hidden>
        <label class="lbl" id="t_name" for="fName"></label>
        <input type="text" id="fName" maxlength="60" autocomplete="name">
        <label class="lbl" id="t_mobile" for="fMobile"></label>
        <input type="tel" id="fMobile" autocomplete="tel">
        <label class="lbl" id="t_country" for="fCountry"></label>
        <select id="fCountry"></select>
        <label class="chk"><input type="checkbox" id="fAnon"><span id="t_anon"></span></label>
        <button class="big" id="bReg"></button>
        <div class="msg" id="regMsg"></div>
      </div>

      <!-- status of my contribution -->
      <div id="vStatus" hidden>
        <div class="status" id="stLine"></div>
        <div class="ok" id="stThanks" hidden></div>
        <div id="stReason" class="warn" hidden></div>
        <audio id="myAudio" controls preload="none" hidden></audio>
        <div class="stats" id="stPlays" hidden></div>
        <button class="btn2 red" id="bWithdraw" hidden></button>
        <div class="confirm" id="wConfirm" hidden>
          <div id="t_wSure"></div>
          <button class="btn2 red" id="bWYes"></button><button class="btn2" id="bWNo"></button>
        </div>
      </div>

      <!-- recorder -->
      <div id="vRec" hidden>
        <span class="lbl" id="t_howMany"></span>
        <div class="opts" id="tgts">
          <button data-n="18" class="on">18</button><button data-n="36">36</button><button data-n="108">108</button>
        </div>
        <span class="lbl" id="t_pace"></span>
        <div class="opts" id="paces">
          <button data-p="1.5"><span class="pn"></span><small>1.5 s</small></button>
          <button data-p="1.2" class="on"><span class="pn"></span><small>1.2 s</small></button>
          <button data-p="0.9"><span class="pn"></span><small>0.9 s</small></button>
        </div>
        <div class="stage" id="stage">
          <div class="count"><span id="cnt">0</span> <small>/ <span id="tgt">18</span></small></div>
          <div class="rem" id="rem"></div>
          <div class="circle" id="circle"></div>
          <div class="pbar"><i id="pb"></i></div>
          <div class="meter"><i id="lvl"></i></div>
          <div class="msg" id="recMsg"></div>
          <button class="big" id="bGo"></button>
        </div>
        <div class="note" id="t_recNote"></div>

        <div id="vReview" hidden>
          <span class="lbl" id="t_listenMine"></span>
          <audio id="revAudio" controls></audio>
          <div class="msg" id="revMsg"></div>
          <label class="chk"><input type="checkbox" id="fConsent"><span id="t_consent"></span></label>
          <button class="big" id="bSubmit" disabled></button>
          <button class="btn2" id="bAgain"></button>
          <div class="msg" id="subMsg"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

      reason: "कारण: {r}", plays: "{p} बार बजा · {c} देश · कुल {n} राम नाम · आज {t} बार",
      withdraw: "मेरी रिकॉर्डिंग वापस लें", wSure: "पक्का? आपकी रिकॉर्डिंग हटा दी जाएगी।", yes: "हाँ, हटाएँ", no: "नहीं",
      errGen: "कुछ गड़बड़ हुई। थोड़ी देर बाद प्रयास करें।", signAgain: "कृपया फिर से साइन इन करें।"
    },
    en: {
      title: "Sri Rama Nama Voice Bank", tag: "Rama Nama in your own voice – heard around the world",
      listenH: "Listen to Rama Nama", soon: "Voices of devotees from around the world will soon play here continuously.",
      offerH: "Offer your voice", myH: "My contribution",
      signinNote: "Sign in with Google to contribute. Once per person.",
      signedAs: "Signed in as {e}", signOut: "Sign out",
      name: "Name (shown while your voice plays)", mobile: "Mobile number", country: "Country",
      anon: "Don't show my name – show 'A devotee'", reg: "Register",
      regNeed: "Name, mobile number and country are all needed.",
      howMany: "How many Rama?", pace: "Pace", paces: ["Slow", "Medium", "Fast"],
      nama: "Rama", start: "Start", stop: "Stop", rem: "{n} to go",
      ready: "After you press Start, 3 – 2 – 1 will appear.",
      recNote: "When the circle glows and Rama appears in it, say Rama; when the circle is empty, pause. Recording stops by itself after the last one. Keep the phone about a hand's length from your mouth.",
      sayNow: "Say Rama when it appears…", getReady: "Get ready…",
      done: "Done – {n} Rama.", early: "Stopped at {d} of {n}.",
      noVoice: "No voice heard on {n} beat(s) – you may record again.",
      micNo: "Microphone not available. Allow the microphone in Chrome.", making: "Preparing…",
      listenMine: "Listen to your recording",
      consent: "I agree that my recording will be played anywhere in the world, at any time, with my name (or 'A devotee') and country.",
      submit: "Submit", again: "Record again", sending: "Sending…",
      thanks: "Thank you! Your voice has been sent for checking ({no}).",
      PENDING: "{no} · {n} Rama – being checked. You will get an email once it is accepted.",
      APPROVED: "{no} · {n} Rama – accepted, now playing around the world.",
      REJECTED: "{no} – could not be added. Please record again.",
      WITHDRAWN: "You withdrew your recording. You may record again if you wish.",
      reason: "Reason: {r}", plays: "Played {p} times · {c} countries · {n} Rama Nama in all · {t} times today",
      withdraw: "Withdraw my recording", wSure: "Are you sure? Your recording will be deleted.", yes: "Yes, delete", no: "No",
      errGen: "Something went wrong. Please try again in a while.", signAgain: "Please sign in again."
    }
  };
  const SCRIPT_LANG = { ta: "ta", deva: "hi", iast: "en" };
  let L = (() => {
    try { const s = localStorage.getItem("rnLang"); if (T[s]) return s; } catch (e) {}
    let sc = "ta"; try { sc = (localStorage.getItem("script") || "ta").toLowerCase(); } catch (e) {}
    return SCRIPT_LANG[sc] || (sc === "ta" ? "ta" : "en");
  })();
  const t = (k, v = {}) => String(T[L][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");

  function applyLang() {
    document.documentElement.lang = L === "hi" ? "hi" : L;
    document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === L));
    for (const k of ["title", "tag", "listenH", "soon", "signinNote", "name", "mobile", "country", "anon",
                     "howMany", "pace", "recNote", "listenMine", "consent", "wSure"]) {
      const el = $("t_" + k); if (el) el.textContent = t(k);
    }
    $("bReg").textContent = t("reg"); $("bSubmit").textContent = t("submit"); $("bAgain").textContent = t("again");
    $("bWithdraw").textContent = t("withdraw"); $("bWYes").textContent = t("yes"); $("bWNo").textContent = t("no");
    document.querySelectorAll("#paces .pn").forEach((s, i) => s.textContent = (T[L].paces || T.en.paces)[i]);
    if (!running) { $("bGo").textContent = t("start"); $("circle").textContent = t("nama"); }
    showCount(done);
    renderState();
  }
  document.querySelectorAll("#langs button").forEach(b => b.onclick = () => {
    L = b.dataset.l; try { localStorage.setItem("rnLang", L); } catch (e) {}
    applyLang(); renderGoogleButton();
  });

  // ---------------- Google sign-in ----------------
  let token = null, me = null;
  try {
    const s = JSON.parse(sessionStorage.getItem("rnTok") || "null");
    if (s && s.exp > Date.now() + 60000) token = s.tok;
  } catch (e) {}

  function onCredential(resp) {
    try {
      const p = JSON.parse(atob(resp.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
      token = resp.credential;
      sessionStorage.setItem("rnTok", JSON.stringify({ tok: token, exp: p.exp * 1000 }));
      localStorage.setItem("rnSigned", "1");
    } catch (e) { token = resp.credential; }
    loadMe();
  }
  let gsiReady = false;
  function initGoogle() {
    if (gsiReady || !window.google || !google.accounts || !google.accounts.id) return false;
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: true });
    gsiReady = true;
    return true;
  }
  function renderGoogleButton() {
    if (!gsiReady) return;
    const box = $("gbtn"); box.innerHTML = "";
    google.accounts.id.renderButton(box, { theme: "outline", size: "large", shape: "pill", text: "signin_with", locale: L });
  }
  function waitGoogle(cb, tries = 0) {
    if (initGoogle()) return cb();
    if (tries > 50) return;
    setTimeout(() => waitGoogle(cb, tries + 1), 200);
  }

  async function api(path, opts = {}) {
    const h = Object.assign({}, opts.headers || {});
    if (token) h.Authorization = "Bearer " + token;
    const r = await fetch(W + path, Object.assign({}, opts, { headers: h }));
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (r.status === 401) { signOut(true); throw new Error(t("signAgain")); }
    if (!r.ok || j.ok === false) throw new Error(j.error || t("errGen"));
    return j;
  }
  function signOut(expired) {
    token = null; me = null;
    try { sessionStorage.removeItem("rnTok"); if (!expired) localStorage.removeItem("rnSigned"); } catch (e) {}
    if (!expired && window.google && google.accounts) google.accounts.id.disableAutoSelect();
    renderState();
  }

  async function loadMe() {
    if (!token) { renderState(); return; }
    try { me = await api("/rn/me"); } catch (e) { me = null; $("signMsg").innerHTML = '<span class="err">' + e.message + "</span>"; }
    renderState();
  }

  // ---------------- views ----------------
  let recDone = false;   // recording finished and waiting for submit
  function renderState() {
    const show = id => ["vSignin", "vReg", "vStatus", "vRec"].forEach(v => $(v).hidden = !id.includes(v));
    $("t_offerH").textContent = me && me.contribution && !me.can_record ? t("myH") : t("offerH");
    if (!token || !me) {
      $("who").hidden = true; show(["vSignin"]); renderGoogleButton(); return;
    }
    const email = (me.devotee && me.devotee.email) || (me.google && me.google.email) || "";
    $("who").hidden = false;
    $("who").innerHTML = t("signedAs", { e: email.replace(/</g, "") }) + ' · <a id="aOut">' + t("signOut") + "</a>";
    $("aOut").onclick = () => signOut(false);
    if (!me.registered) { show(["vReg"]); prefillReg(); return; }
    const c = me.contribution;
    const views = [];
    if (c) { views.push("vStatus"); fillStatus(c); }
    if (me.can_record) views.push("vRec");
    show(views);
  }

  function fillStatus(c) {
    $("stLine").textContent = t(c.status, { no: c.no, n: c.count });
    $("stReason").hidden = !(c.status === "REJECTED" && c.reason);
    if (c.reason) $("stReason").textContent = t("reason", { r: c.reason });
    const hasAudio = c.status === "PENDING" || c.status === "APPROVED";
    $("myAudio").hidden = !hasAudio; $("bWithdraw").hidden = !hasAudio; $("wConfirm").hidden = true;
    if (hasAudio && !$("myAudio").dataset.loaded) loadMyAudio();
    const p = me.plays;
    $("stPlays").hidden = !(c.status === "APPROVED" && p);
    if (p) $("stPlays").textContent = t("plays", { p: p.total, c: p.countries, n: p.nama, t: p.today });
  }
  async function loadMyAudio() {
    try {
      const r = await fetch(W + "/rn/my-audio", { headers: { Authorization: "Bearer " + token } });
      if (!r.ok) return;
      if ((r.headers.get("content-type") || "").includes("json")) { const j = await r.json(); $("myAudio").src = j.url; }
      else $("myAudio").src = URL.createObjectURL(await r.blob());
      $("myAudio").dataset.loaded = "1";
    } catch (e) {}
  }
  $("bWithdraw").onclick = () => { $("wConfirm").hidden = false; };
  $("bWNo").onclick = () => { $("wConfirm").hidden = true; };
  $("bWYes").onclick = async () => {
    try { await api("/rn/withdraw", { method: "POST" }); delete $("myAudio").dataset.loaded; $("myAudio").removeAttribute("src"); await loadMe(); }
    catch (e) { $("stLine").innerHTML += ' <span class="err">' + e.message + "</span>"; }
  };

  // ---------------- registration ----------------
  let iti = null;
  function setupReg() {
    if (iti || !window.intlTelInput) return;
    iti = window.intlTelInput($("fMobile"), {
      initialCountry: "in", preferredCountries: ["in", "us", "gb", "sg", "ae", "au", "ca", "my"], separateDialCode: true,
      utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
    });
    const list = window.intlTelInputGlobals.getCountryData()
      .map(c => ({ iso: c.iso2.toUpperCase(), name: c.name.replace(/\s*\(.*\)\s*$/, "") }))
      .sort((a, b) => a.name.localeCompare(b.name));
    $("fCountry").innerHTML = list.map(c => `<option value="${c.iso}">${c.name}</option>`).join("");
    $("fCountry").value = "IN";
    $("fMobile").addEventListener("countrychange", () => {
      const d = iti.getSelectedCountryData(); if (d && d.iso2 && !$("fCountry").dataset.touched) $("fCountry").value = d.iso2.toUpperCase();
    });
    $("fCountry").addEventListener("change", () => $("fCountry").dataset.touched = "1");
  }
  function prefillReg() {
    setupReg();
    if (!$("fName").value && me && me.google && me.google.name) $("fName").value = me.google.name;
  }
  $("bReg").onclick = async () => {
    const name = $("fName").value.trim();
    let mobile = $("fMobile").value.trim();
    if (iti) { const n = iti.getNumber(); if (n) mobile = n; }
    const sel = $("fCountry"); const cc = sel.value; const cn = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : "";
    if (!name || mobile.replace(/\D/g, "").length < 6 || !cc) { $("regMsg").innerHTML = '<span class="err">' + t("regNeed") + "</span>"; return; }
    $("bReg").disabled = true;
    try {
      const script = (localStorage.getItem("script") || (L === "hi" ? "deva" : L === "en" ? "iast" : "ta"));
      await api("/rn/register", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ display_name: name, mobile, country_code: cc, country_name: cn, anonymous: $("fAnon").checked, ui_script: script }) });
      $("regMsg").textContent = ""; await loadMe();
    } catch (e) { $("regMsg").innerHTML = '<span class="err">' + e.message + "</span>"; }
    $("bReg").disabled = false;
  };

  // ---------------- guided recording (as tested on ramanama_test.html) ----------------
  const OUT_RATE = 22050, KBPS = 32, COUNTDOWN = 3, HOP_MS = 10;
  let target = 18, period = 1.2;
  let ctx = null, stream = null, src = null, proc = null, mute = null, wake = null;
  let chunks = [], sr = 48000, samples = 0, recT0 = 0, firstBeat = 0, raf = 0;
  let running = false, busy = false, done = 0, lastBeat = -1;
  let hop = 480, rest = new Float32Array(0), frames = [];
  let mp3 = null, mp3Secs = 0, silentBeats = [];

  function pick(groupId, attr, cb) {
    document.querySelectorAll("#" + groupId + " button").forEach(b => b.onclick = () => {
      if (running || busy) return;
      document.querySelectorAll("#" + groupId + " button").forEach(x => x.classList.remove("on"));
      b.classList.add("on"); cb(b.dataset[attr]);
    });
  }
  pick("tgts", "n", v => { target = +v; showCount(0); });
  pick("paces", "p", v => { period = +v; });
  function showCount(n) { $("cnt").textContent = n; $("tgt").textContent = target; $("rem").textContent = t("rem", { n: target - n }); }

  function feed(x) {
    let buf = x;
    if (rest.length) { buf = new Float32Array(rest.length + x.length); buf.set(rest); buf.set(x, rest.length); }
    let i = 0;
    for (; i + hop <= buf.length; i += hop) {
      let s = 0; for (let k = i; k < i + hop; k++) s += buf[k] * buf[k];
      const db = 10 * Math.log10(s / hop + 1e-12);
      frames.push(db);
      $("lvl").style.width = Math.max(0, Math.min(100, (db + 70) * 1.6)) + "%";
    }
    rest = buf.slice(i);
  }
  function loop() {
    if (!running) return;
    const tm = ctx.currentTime, c = $("circle");
    if (tm < firstBeat) {
      const left = Math.ceil((firstBeat - tm) / period);
      const frac = 1 - ((firstBeat - tm) / period - (left - 1));
      c.classList.add("cd"); c.classList.remove("beat"); c.textContent = frac < 0.5 ? left : "";
      $("pb").style.width = (100 * frac) + "%";
    } else {
      const b = Math.floor((tm - firstBeat) / period);
      if (b >= target) {
        c.classList.remove("beat"); c.textContent = ""; $("pb").style.width = "100%";
        if (tm >= firstBeat + target * period + 0.4) { finish(true); return; }
      } else {
        const frac = ((tm - firstBeat) % period) / period, on = frac < 0.5;
        c.classList.remove("cd"); c.textContent = on ? t("nama") : ""; c.classList.toggle("beat", on);
        c.style.transform = "scale(" + (on ? 1.08 - 0.08 * frac / 0.5 : 1) + ")";
        $("pb").style.width = (100 * frac) + "%";
        if (b !== lastBeat) { lastBeat = b; done = b + 1; showCount(done); $("recMsg").textContent = t("sayNow"); }
      }
    }
    raf = requestAnimationFrame(loop);
  }
  $("bGo").onclick = () => running ? finish(false) : start();

  async function start() {
    resetRec();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    } catch (e) { $("recMsg").innerHTML = '<span class="err">' + t("micNo") + "</span>"; return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC(); await ctx.resume();
    sr = ctx.sampleRate; hop = Math.round(sr * HOP_MS / 1000);
    src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(2048, 1, 1);
    mute = ctx.createGain(); mute.gain.value = 0;
    proc.onaudioprocess = e => {
      if (!running) return;
      if (samples === 0) recT0 = e.playbackTime || ctx.currentTime;
      const x = new Float32Array(e.inputBuffer.getChannelData(0));
      chunks.push(x); samples += x.length; feed(x);
    };
    src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    try { wake = await navigator.wakeLock.request("screen"); } catch (e) { wake = null; }
    running = true; busy = true;
    firstBeat = ctx.currentTime + COUNTDOWN * period;
    $("bGo").textContent = t("stop"); $("bGo").classList.add("stop");
    $("recMsg").textContent = t("getReady");
    $("stage").scrollIntoView({ behavior: "smooth", block: "start" });
    raf = requestAnimationFrame(loop);
  }
  function finish(complete) {
    if (!running) return;
    running = false; cancelAnimationFrame(raf);
    try { proc.disconnect(); src.disconnect(); mute.disconnect(); } catch (e) {}
    stream.getTracks().forEach(tr => tr.stop());
    const cref = ctx; setTimeout(() => cref.close(), 200);
    if (wake) { wake.release().catch(() => {}); wake = null; }
    const c = $("circle"); c.classList.remove("beat", "cd"); c.style.transform = ""; c.textContent = t("nama");
    $("bGo").textContent = t("start"); $("bGo").classList.remove("stop"); $("bGo").disabled = true;
    $("lvl").style.width = "0"; $("pb").style.width = "0";
    $("recMsg").innerHTML = complete ? t("done", { n: target }) : '<span class="warn">' + t("early", { d: done, n: target }) + "</span>";
    encode(complete);
  }
  function resetRec() {
    chunks = []; samples = 0; rest = new Float32Array(0); frames = []; done = 0; lastBeat = -1;
    mp3 = null; recDone = false; $("vReview").hidden = true; $("subMsg").textContent = ""; $("fConsent").checked = false;
    $("bSubmit").disabled = true; showCount(0);
  }
  function beatCheck(n) {
    const s = frames.slice().sort((a, b) => a - b);
    const floor = s.length ? s[Math.floor(s.length * 0.1)] : -70, thr = Math.max(floor + 12, -60), silent = [];
    for (let i = 0; i < n; i++) {
      const a = Math.round((firstBeat - recT0 + i * period) * 100), b = Math.round((firstBeat - recT0 + (i + 1) * period) * 100);
      let v = 0, tot = 0; for (let k = a; k < b && k < frames.length; k++) { tot++; if (frames[k] > thr) v++; }
      if (!tot || v / tot < 0.2) silent.push(i + 1);
    }
    return silent;
  }
  async function encode(complete) {
    $("vReview").hidden = false; $("revMsg").textContent = t("making");
    const all = new Float32Array(samples); let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
    const startS = Math.max(0, Math.round((firstBeat - recT0 - 0.3) * sr));
    const endS = Math.min(samples, Math.round((firstBeat - recT0 + done * period + 0.4) * sr));
    const n = Math.max(0, endS - startS), ratio = sr / OUT_RATE, m = Math.floor(n / ratio);
    const pcm = new Float32Array(m); let pk = 0;
    for (let i = 0; i < m; i++) {
      const a = startS + Math.floor(i * ratio), b = Math.max(a + 1, startS + Math.floor((i + 1) * ratio));
      let s = 0; for (let k = a; k < b; k++) s += all[k];
      const v = s / (b - a); pcm[i] = v; if (Math.abs(v) > pk) pk = Math.abs(v);
    }
    const g = pk > 0 ? Math.min(4, 0.89 / pk) : 1, i16 = new Int16Array(m);
    for (let i = 0; i < m; i++) i16[i] = Math.max(-32767, Math.min(32767, pcm[i] * g * 32767));
    const enc = new lamejs.Mp3Encoder(1, OUT_RATE, KBPS), parts = [];
    for (let i = 0; i < m; i += 1152) {
      const b = enc.encodeBuffer(i16.subarray(i, i + 1152)); if (b.length) parts.push(b);
      if ((i / 1152) % 300 === 0) await new Promise(r => setTimeout(r, 0));
    }
    const f = enc.flush(); if (f.length) parts.push(f);
    mp3 = new Blob(parts, { type: "audio/mpeg" }); mp3Secs = m / OUT_RATE;
    $("revAudio").src = URL.createObjectURL(mp3);
    silentBeats = beatCheck(done);
    $("revMsg").innerHTML = silentBeats.length ? '<span class="warn">' + t("noVoice", { n: silentBeats.length }) + "</span>" : "";
    recDone = complete && done === target;
    $("bSubmit").disabled = !(recDone && $("fConsent").checked);
    $("bGo").disabled = false; busy = false;
    $("vReview").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  $("fConsent").onchange = () => { $("bSubmit").disabled = !(recDone && mp3 && $("fConsent").checked); };
  $("bAgain").onclick = () => { resetRec(); $("recMsg").textContent = t("ready"); $("stage").scrollIntoView({ behavior: "smooth", block: "start" }); };
  $("bSubmit").onclick = async () => {
    if (!mp3 || !$("fConsent").checked) return;
    $("bSubmit").disabled = true; $("subMsg").textContent = t("sending");
    try {
      const q = new URLSearchParams({ count: target, pace: period, dur: mp3Secs.toFixed(1), silent: silentBeats.join(" "), consent: CONSENT });
      const j = await api("/rn/upload?" + q.toString(), { method: "POST", headers: { "Content-Type": "audio/mpeg" }, body: mp3 });
      resetRec(); await loadMe();
      $("stThanks").textContent = t("thanks", { no: j.no }); $("stThanks").hidden = false;
      $("cardMe").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {
      $("subMsg").innerHTML = '<span class="err">' + e.message + "</span>"; $("bSubmit").disabled = false;
    }
  };

  // ---------------- start ----------------
  $("recMsg").textContent = t("ready");
  applyLang();
  if (token) loadMe(); else renderState();
  waitGoogle(() => {
    renderGoogleButton();
    if (!token && localStorage.getItem("rnSigned") === "1") google.accounts.id.prompt();
  });
})();
</script>
</body>
</html>
