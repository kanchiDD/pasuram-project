<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f5c242">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arulicheyal">
  <link rel="apple-touch-icon" href="/assets/icons/icon-152x152.png">
  <title>Search — நாலாயிர திவ்யப்பிரபந்தம்</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css?v=861">
  <script src="./js/layout.js" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      if (typeof loadLayout === "function") loadLayout();
    });
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: #FFFFF8; min-height: 100vh; display: flex; flex-direction: column; }
    #header { width: 100%; }
    #footer { width: 100%; margin-top: auto; }

    /* ── script picker ── */
    #sp-bar { background: #FFF8E6; border-bottom: 1px solid #E8D8A0; padding: 7px 10px;
              display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
    #sp-bar .sp-label { font-size: 12px; color: #8A7A5A; margin-right: 2px; }
    #sp-bar button { border: 1px solid #D8C48A; background: #FFF; color: #4A3728;
                     border-radius: 14px; padding: 5px 13px; font-size: 13px; cursor: pointer;
                     font-weight: 500; -webkit-tap-highlight-color: transparent; }
    #sp-bar button.on { border-color: #2F7D32; background: #2F7D32; color: #FFF; font-weight: 700; }

    /* ── stage ── */
    #search-stage { flex: 1; display: flex; flex-direction: column; align-items: center;
                    padding: 28px 16px 60px; gap: 18px; }
    .ss-title { text-align: center; }
    .ss-title h1 { font-size: 19px; font-weight: 600; color: #3B2410; letter-spacing: 0.02em; }
    .ss-title p  { font-size: 13px; color: #8B6A45; margin-top: 5px; }

    .ss-boxwrap { width: 100%; max-width: 560px; position: relative; }
    .ss-inputrow { display: flex; align-items: center; gap: 10px; background: #FFF;
                   border: 1.5px solid #C9A84C; border-radius: 26px; padding: 11px 16px;
                   box-shadow: 0 2px 10px rgba(74,55,40,0.08); transition: box-shadow 0.15s, border-color 0.15s; }
    .ss-inputrow:focus-within { border-color: #4A3728; box-shadow: 0 4px 18px rgba(74,55,40,0.16); }
    .ss-inputrow > i { color: #B09070; font-size: 15px; flex-shrink: 0; }
    #ss-input { flex: 1; border: none; outline: none; background: transparent;
                font-size: 17px; color: #3B2410; font-family: inherit; min-width: 0; }
    #ss-input::placeholder { color: #C0A88A; font-size: 15px; }
    #ss-clear { border: none; background: transparent; color: #B09070; font-size: 17px;
                cursor: pointer; display: none; padding: 0 2px; line-height: 1; }
    #ss-clear.show { display: block; }
    #ss-spin { color: #C9A84C; font-size: 13px; display: none; }
    #ss-spin.show { display: block; }

    /* ── suggestions ── */
    #ss-list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: #FFFDF7;
               border: 1px solid #D4B896; border-radius: 12px; overflow: hidden; z-index: 40;
               box-shadow: 0 8px 26px rgba(40,25,10,0.14); display: none; }
    #ss-list.show { display: block; }
    .ss-item { display: flex; align-items: flex-start; gap: 11px; padding: 11px 15px;
               cursor: pointer; border-bottom: 1px solid #F0E3C8; min-height: 46px;
               -webkit-tap-highlight-color: transparent; }
    .ss-item:last-child { border-bottom: none; }
    .ss-item:hover, .ss-item.active { background: #FFF0CC; }
    .ss-ico { color: #B09070; font-size: 13px; margin-top: 3px; width: 15px; text-align: center; flex-shrink: 0; }
    .ss-body { min-width: 0; flex: 1; }
    .ss-main { font-size: 15px; color: #3B2410; line-height: 1.35; word-break: break-word; }
    .ss-sub  { font-size: 11.5px; color: #9A7A55; margin-top: 2px; }
    .ss-sep  { padding: 6px 15px; background: #FBF3E2; font-size: 10.5px; color: #B09070;
               text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid #F0E3C8; }

    .ss-state { padding: 13px 15px; font-size: 13px; color: #9A7A55; text-align: center; }
    .ss-hint  { font-size: 12.5px; color: #B09070; text-align: center; max-width: 480px; line-height: 1.6; }

    .ss-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 520px; }
    .ss-chips-label { width: 100%; text-align: center; font-size: 11px; color: #B09070;
                      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 1px; }
    .ss-chip { font-size: 12.5px; padding: 6px 14px; border-radius: 20px; border: 1px solid #D4B896;
               background: #FFF8ED; color: #7A5C3A; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ss-chip:hover { border-color: #4A3728; color: #4A3728; background: #FFF0CC; }

    @media (max-width: 420px) {
      #search-stage { padding: 20px 14px 50px; }
      .ss-title h1 { font-size: 17px; }
      #ss-input { font-size: 16px; }   /* keeps iOS from zooming on focus */
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <div id="sp-bar"></div>

  <main id="search-stage">
    <div class="ss-title">
      <h1>நாலாயிர திவ்யப்பிரபந்தம்</h1>
      <p>Search — type a few letters</p>
    </div>

    <div class="ss-boxwrap">
      <div class="ss-inputrow">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="ss-input" type="search" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false"
               aria-label="Search" aria-autocomplete="list" aria-controls="ss-list" />
        <i id="ss-spin" class="fa-solid fa-circle-notch fa-spin"></i>
        <button id="ss-clear" aria-label="Clear">&times;</button>
      </div>
      <div id="ss-list" role="listbox"></div>
    </div>

    <div class="ss-hint" id="ss-hint"></div>

    <div class="ss-chips">
      <div class="ss-chips-label">Try</div>
      <div class="ss-chip" data-q="thiruppavai">thiruppavai</div>
      <div class="ss-chip" data-q="nammazhwar">nammazhwar</div>
      <div class="ss-chip" data-q="periyazhwar thirumozhi mudhal pathu">periyazhwar thirumozhi mudhal pathu</div>
      <div class="ss-chip" data-q="srirangam">srirangam</div>
      <div class="ss-chip" data-q="koil">koil</div>
    </div>
  </main>

  <div id="footer"></div>

<script type="module">
/* =====================================================================
   search.html — predictive search
   ---------------------------------------------------------------------
   Two sources run on every keystroke and are merged:

     1. voiceSearch.js — the resolver voice search already uses. It
        understands intent: ordinals ("mudhal pathu", "7th thirumozhi"),
        an azhwar expanding to their works, thousands, the special
        destinations, a bare pasuram number. Its results are already
        destinations, so they need no routing.

     2. /api/suggest — the FTS index over names, aliases and all 34,000
        pasuram lines in six scripts. This finds text; it cannot reason
        about phrases, which is why it alone could not answer
        "periyazhwar thirumozhi mudhal pathu".

   Destinations come first, matched text after. Tapping either hands off
   through the same sessionStorage "voiceNav" contract voice already
   uses, so tree.html needs no change.
   ===================================================================== */

const SUGGEST_URL = "https://workeri18n.kanchitrust.workers.dev/api/suggest";

const SCRIPTS = [
  { code: "ta",   label: "தமிழ்",     name: "Tamil"      },
  { code: "te",   label: "తెలుగు",    name: "Telugu"     },
  { code: "kn",   label: "ಕನ್ನಡ",      name: "Kannada"    },
  { code: "ml",   label: "മലയാളം",    name: "Malayalam"  },
  { code: "deva", label: "देवनागरी",   name: "Devanagari" },
  { code: "iast", label: "Roman",     name: "Roman"      }
];

const MIN_CHARS = 3;
const DEBOUNCE  = 180;
const MAX_ROWS  = 9;

function activeScript() {
  try { return (localStorage.getItem("script") || "ta").toLowerCase(); }
  catch (e) { return "ta"; }
}
function setActiveScript(code) {
  try {
    if (code && code !== "ta") localStorage.setItem("script", code);
    else localStorage.removeItem("script");
  } catch (e) {}
}

const SCRIPT = activeScript();

/* ─────────────────────────────────────────────────────────────
   Script conversion

   The Indic blocks sit in parallel in Unicode, so Tamil to any of
   the others is a fixed offset — and back again is the same offset
   the other way. Only characters inside the relevant block move, so
   digits, spaces and English are untouched.

   Needed in both directions: the resolver speaks Tamil and Roman
   only, so a Telugu reader's typing is turned into Tamil before it
   is handed over, and the Tamil labels it returns are turned back.
   ───────────────────────────────────────────────────────────── */

const BLOCK = {
  te:   { lo: 0x0C00, hi: 0x0C7F, off:  0x080 },
  kn:   { lo: 0x0C80, hi: 0x0CFF, off:  0x100 },
  ml:   { lo: 0x0D00, hi: 0x0D7F, off:  0x180 },
  deva: { lo: 0x0900, hi: 0x097F, off: -0x280 }
};
const TAMIL_LO = 0x0B80, TAMIL_HI = 0x0BFF;

/* Tamil to the other Indic blocks is one fixed codepoint offset — but not
   for every letter. Tamil distinguishes ன from ந and carries ழ, and at the
   shifted position those land on codepoints Telugu and Kannada never
   assigned, so they render as empty boxes. These are the substitutions a
   proper transliterator makes. */
const SCRIPT_EXC = {
  te:   { "\u0ba9": "\u0c28", "\u0bd7": "\u0c57" },
  kn:   { "\u0ba9": "\u0ca8", "\u0bb4": "\u0cde", "\u0bd7": "\u0ccc" },
  ml:   {},
  deva: {}
};

function fromTamil(text, script) {
  const b = BLOCK[script];
  if (!b || !text) return text || "";
  const exc = SCRIPT_EXC[script] || {};
  let out = "";
  for (const ch of String(text)) {
    if (exc[ch]) { out += exc[ch]; continue; }
    const c = ch.codePointAt(0);
    out += (c >= TAMIL_LO && c <= TAMIL_HI) ? String.fromCodePoint(c + b.off) : ch;
  }
  return out;
}

function toTamil(text, script) {
  const b = BLOCK[script];
  if (!b || !text) return text || "";
  let out = "";
  for (const ch of String(text)) {
    const c = ch.codePointAt(0);
    out += (c >= b.lo && c <= b.hi) ? String.fromCodePoint(c - b.off) : ch;
  }
  return out;
}

/* Tamil text coming back from the resolver, shown in the reader's script.
   Roman readers keep the Tamil as-is — the resolver's own labels are the
   canonical names and there is no reverse transliteration for IAST here. */
function disp(text) {
  if (SCRIPT === "ta" || SCRIPT === "iast") return String(text == null ? "" : text);
  return fromTamil(String(text == null ? "" : text), SCRIPT);
}

/* What the reader typed, in the form the resolver can understand. */
function forResolver(q) {
  if (SCRIPT === "ta" || SCRIPT === "iast") return q;
  return toTamil(q, SCRIPT);
}

/* ── script picker ──────────────────────────────────────────── */

(function buildPicker() {
  const bar = document.getElementById("sp-bar");

  const lab = document.createElement("span");
  lab.className = "sp-label";
  lab.textContent = "Read in:";
  bar.appendChild(lab);

  for (const s of SCRIPTS) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = s.label;
    b.title = s.name;
    if (s.code === SCRIPT) b.className = "on";
    b.addEventListener("click", function () {
      if (s.code === SCRIPT) return;
      setActiveScript(s.code);
      location.reload();
    });
    bar.appendChild(b);
  }
})();

/* ── the resolver, loaded lazily and warmed early ───────────── */

let vsMod = null, vsPending = null;

function warmResolver() {
  if (vsMod)     return Promise.resolve(vsMod);
  if (vsPending) return vsPending;
  vsPending = import("./js/voiceSearch.js?v=6")
    .then(function (m) { vsMod = m; return m; })
    .catch(function () { return null; });
  return vsPending;
}

async function askResolver(q) {
  const m = await warmResolver();
  if (!m) return [];
  const fn = m.resolveVoiceQueryExtended || m.resolveVoiceQuery;
  if (typeof fn !== "function") return [];
  try {
    const out = await fn(forResolver(q));
    return Array.isArray(out) ? out : (out ? [out] : []);
  } catch (e) { return []; }
}

/* ── routing for index results ──────────────────────────────── */

const DIRECT_ROUTE = {
  section:    function (r) { return { fn: "_selectSection",      args: [Number(r.eid), r.ta] }; },
  divyadesam: function (r) { return { fn: "_openDivyadesamById", args: [Number(r.eid), r.ta] }; },
  perumal:    function (r) { return { fn: "_openDivyadesamById", args: [Number(r.eid), r.ta] }; },
  thayar:     function (r) { return { fn: "_openDivyadesamById", args: [Number(r.eid), r.ta] }; },
  pasuram:    function (r) { return { fn: "_openGlobalPasuram",  args: [Number(r.eid)] }; }
};

const TYPE_LABEL = {
  section: "Section", divyadesam: "Divyadesam", perumal: "Perumal", thayar: "Thayar",
  pasuram: "Pasuram", pathu: "Pathu", thirumozhi: "Thirumozhi", thaniyan: "Thaniyan",
  azhwar: "Azhwar", author: "Author", region: "Region", thousand: "Thousand"
};
const TYPE_ICON = {
  section: "fa-book", divyadesam: "fa-place-of-worship", perumal: "fa-place-of-worship",
  thayar: "fa-place-of-worship", pasuram: "fa-feather", pathu: "fa-layer-group",
  thirumozhi: "fa-layer-group", thaniyan: "fa-scroll", azhwar: "fa-user",
  author: "fa-user", region: "fa-map", thousand: "fa-book-open"
};

/* ── dom ────────────────────────────────────────────────────── */

const input = document.getElementById("ss-input");
const list  = document.getElementById("ss-list");
const clear = document.getElementById("ss-clear");
const spin  = document.getElementById("ss-spin");
const hint  = document.getElementById("ss-hint");

input.placeholder = "Search pasurams, sections, temples…";
hint.textContent  = "Three letters is enough. Whole phrases work too — try naming a pathu or a thirumozhi.";

let rows = [], active = -1, timer = null, seq = 0;

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function showState(html) {
  list.innerHTML = '<div class="ss-state">' + html + "</div>";
  list.classList.add("show");
}
function hideList() {
  list.classList.remove("show");
  list.innerHTML = "";
  rows = []; active = -1;
}

function render() {
  if (!rows.length) { showState("Nothing found"); return; }

  let html = "";
  let lastGroup = null;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const group = (r.kind === "dest") ? "go" : (r.kind === "line" ? "line" : "name");
    if (group !== lastGroup) {
      html += '<div class="ss-sep">' +
              (group === "go" ? "Go to" : group === "name" ? "Matching names" : "In the pasurams") +
              "</div>";
      lastGroup = group;
    }
    html += '<div class="ss-item' + (i === active ? " active" : "") + '" role="option" data-i="' + i + '">' +
              '<i class="ss-ico fa-solid ' + r.icon + '"></i>' +
              '<div class="ss-body">' +
                '<div class="ss-main">' + esc(r.txt) + "</div>" +
                (r.sub ? '<div class="ss-sub">' + esc(r.sub) + "</div>" : "") +
              "</div>" +
            "</div>";
  }
  list.innerHTML = html;
  list.classList.add("show");
}

/* ── the two sources ────────────────────────────────────────── */

async function askIndex(q, signal) {
  const url = SUGGEST_URL +
              "?q="      + encodeURIComponent(q) +
              "&script=" + encodeURIComponent(SCRIPT) +
              "&limit=8";
  const res  = await fetch(url, { signal: signal });
  const data = await res.json();
  return (data && data.results) || [];
}

let ctrl = null;

async function run(q) {
  const mine = ++seq;
  if (ctrl) { try { ctrl.abort(); } catch (e) {} }
  ctrl = new AbortController();
  const myCtrl = ctrl;

  spin.classList.add("show");

  const settled = await Promise.allSettled([
    askIndex(q, myCtrl.signal),
    askResolver(q)
  ]);

  if (mine !== seq) return;              // a later keystroke already won
  spin.classList.remove("show");

  const idxRows = settled[0].status === "fulfilled" ? settled[0].value : [];
  const resRows = settled[1].status === "fulfilled" ? settled[1].value : [];

  if (settled[0].status === "rejected" && settled[0].reason &&
      settled[0].reason.name === "AbortError") return;

  rows   = merge(resRows, idxRows);
  active = -1;
  render();
}

/* Destinations first, then matched names, then pasuram lines.
   A destination and an index row can be the same thing under two
   names, so anything already shown is not shown again. */
function merge(resRows, idxRows) {
  const out  = [];
  const seen = new Set();

  function key(s) { return String(s || "").replace(/\s+/g, "").toLowerCase(); }
  function take(row) {
    const k = key(row.txt);
    if (!k || seen.has(k)) return;
    seen.add(k);
    out.push(row);
  }

  resRows
    .slice()
    .sort(function (a, b) { return (b.score || 0) - (a.score || 0); })
    .forEach(function (r) {
      if (!r || !r.fn) return;
      take({
        kind: "dest",
        txt:  disp(r.label),
        sub:  disp(r.sublabel),
        icon: "fa-arrow-right-to-bracket",
        fn:   r.fn,
        args: r.args || []
      });
    });

  idxRows.filter(function (r) { return r.kind === "entity"; }).forEach(function (r) {
    take({
      kind:  "entity",
      txt:   r.txt,
      sub:   TYPE_LABEL[r.etype] || "Result",
      icon:  TYPE_ICON[r.etype] || "fa-magnifying-glass",
      etype: r.etype, eid: r.eid, ta: r.ta
    });
  });

  idxRows.filter(function (r) { return r.kind === "line"; }).forEach(function (r) {
    take({
      kind: "line",
      txt:  r.txt,
      sub:  "Pasuram " + r.gno,
      icon: "fa-feather",
      gno:  r.gno
    });
  });

  return out.slice(0, MAX_ROWS);
}

/* ── typing ─────────────────────────────────────────────────── */

function onType() {
  const q = input.value.trim();
  clear.classList.toggle("show", q.length > 0);

  if (timer) clearTimeout(timer);
  if (q.length < MIN_CHARS) { hideList(); spin.classList.remove("show"); return; }
  timer = setTimeout(function () { run(q); }, DEBOUNCE);
}

/* ── choosing ───────────────────────────────────────────────── */

function go(fn, args, label) {
  try {
    sessionStorage.setItem("voiceNav", JSON.stringify({ fn: fn, args: args, label: label || "" }));
  } catch (e) {}
  window.location.href = "tree.html";
}

async function choose(i) {
  const r = rows[i];
  if (!r) return;

  if (r.fn) { go(r.fn, r.args, r.txt); return; }
  if (r.kind === "line") { go("_openGlobalPasuram", [Number(r.gno)], r.txt); return; }

  const direct = DIRECT_ROUTE[r.etype];
  if (direct) { const d = direct(r); go(d.fn, d.args, r.txt); return; }

  // Types the index carries but cannot route on its own — hand the Tamil
  // name to the resolver and take its best destination.
  showState("Opening…");
  const out  = await askResolver(r.ta || r.txt);
  const best = out && out[0];
  if (best && best.fn) { go(best.fn, best.args || [], r.txt); return; }

  showState("Could not open that one");
}

/* ── wiring ─────────────────────────────────────────────────── */

input.addEventListener("input", onType);
input.addEventListener("focus", warmResolver);

input.addEventListener("keydown", function (e) {
  if (!list.classList.contains("show") || !rows.length) return;
  if (e.key === "ArrowDown")    { e.preventDefault(); active = (active + 1) % rows.length; render(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); active = (active - 1 + rows.length) % rows.length; render(); }
  else if (e.key === "Enter")   { e.preventDefault(); choose(active >= 0 ? active : 0); }
  else if (e.key === "Escape")  { hideList(); }
});

list.addEventListener("click", function (e) {
  const item = e.target.closest(".ss-item");
  if (!item) return;
  choose(Number(item.getAttribute("data-i")));
});

clear.addEventListener("click", function () {
  input.value = "";
  clear.classList.remove("show");
  hideList();
  input.focus();
});

document.addEventListener("click", function (e) {
  if (!e.target.closest(".ss-boxwrap")) hideList();
});

document.querySelectorAll(".ss-chip").forEach(function (c) {
  c.addEventListener("click", function () {
    input.value = c.getAttribute("data-q") || "";
    clear.classList.add("show");
    input.focus();
    onType();
  });
});

// Warm the resolver's data in the background so the first search is not
// the one that pays for loading it.
if (window.requestIdleCallback) requestIdleCallback(warmResolver, { timeout: 2500 });
else setTimeout(warmResolver, 1200);

if (!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) input.focus();
</script>
</body>
</html>
