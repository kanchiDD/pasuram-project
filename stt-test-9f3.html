<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Voice STT Test — arulicheyal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF4E6; --ink:#2B2115; --soft:#7A6A52; --gold:#B8863B;
    --deep:#7A1F1A; --ok:#2E6B33; --line:#E4D3AC; --card:#FFFCF5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Spectral","Noto Sans Tamil",serif;
       -webkit-tap-highlight-color:transparent;padding:20px 16px 60px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-family:"Noto Sans Tamil";font-size:20px;color:var(--deep);margin:0 0 2px}
  .sub{font-size:13px;color:var(--soft);margin-bottom:18px}
  .cfg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px}
  .cfg label{display:block;font-size:12px;color:var(--soft);margin-bottom:4px}
  .cfg input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
             font-family:inherit;font-size:14px;background:#fff}
  .mic{display:flex;flex-direction:column;align-items:center;gap:10px;margin:26px 0}
  .micbtn{width:112px;height:112px;border-radius:50%;border:none;cursor:pointer;
          background:var(--deep);color:#fff;font-size:44px;display:flex;align-items:center;
          justify-content:center;box-shadow:0 6px 20px rgba(122,31,26,.35);transition:transform .1s}
  .micbtn:active{transform:scale(.95)}
  .micbtn.rec{background:#B8342B;animation:pulse 1.1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,52,43,.5)}70%{box-shadow:0 0 0 22px rgba(184,52,43,0)}100%{box-shadow:0 0 0 0 rgba(184,52,43,0)}}
  .hint{font-size:13px;color:var(--soft);text-align:center;min-height:20px}
  .result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:8px;display:none}
  .result.show{display:block}
  .rlabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
  .transcript{font-family:"Noto Sans Tamil";font-size:22px;color:var(--deep);line-height:1.4;word-break:break-word}
  .alts{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .alts .a{font-family:"Noto Sans Tamil";font-size:15px;color:var(--ink);padding:3px 0}
  .alts .a .n{color:var(--soft);font-size:12px;margin-right:6px}
  .timing{margin-top:12px;font-size:12px;color:var(--soft)}
  .err{color:#B8342B;font-size:14px}
  .log{margin-top:20px;font-size:12px;color:var(--soft);white-space:pre-wrap;word-break:break-word}
  .n{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ குரல் சோதனை — Voice STT test</h1>
  <div class="sub">Tap, speak a pasuram / desam / "சாதித்தருளாய்", release-free. It auto-stops when you pause.</div>

  <div class="cfg">
    <label>Worker endpoint (your STT worker URL + /transcribe)</label>
    <input id="ep" placeholder="https://stt.kanchitrust.workers.dev/transcribe"
           value="https://stt.kanchitrust.workers.dev/transcribe">
  </div>

  <div class="mic">
    <button class="micbtn" id="mic" aria-label="Record">🎙️</button>
    <div class="hint" id="hint">Tap to speak</div>
  </div>

  <div class="result" id="result">
    <div class="rlabel">Heard (best guess)</div>
    <div class="transcript" id="transcript">—</div>
    <div class="alts" id="alts"></div>
    <div class="timing" id="timing"></div>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
const micBtn = document.getElementById("mic");
const hint   = document.getElementById("hint");
const epInput= document.getElementById("ep");
const resultBox = document.getElementById("result");
const transcriptEl = document.getElementById("transcript");
const altsEl = document.getElementById("alts");
const timingEl = document.getElementById("timing");
const logEl = document.getElementById("log");

let mediaRecorder = null, chunks = [], stream = null;
let audioCtx = null, analyser = null, silenceTimer = null, recording = false;

function log(s){ logEl.textContent = s; }

async function startRec(){
  if (recording) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e){
    hint.textContent = "Microphone blocked. Please allow mic access.";
    return;
  }
  chunks = [];
  // Pick a mimeType MediaRecorder actually supports on this device
  let mime = "audio/webm;codecs=opus";
  if (!MediaRecorder.isTypeSupported(mime)) {
    mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
         : MediaRecorder.isTypeSupported("audio/mp4")  ? "audio/mp4"
         : "";
  }
  mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime })
                       : new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = onStop;
  mediaRecorder.start();
  recording = true;
  micBtn.classList.add("rec");
  micBtn.textContent = "■";
  hint.textContent = "Listening… speak now";
  resultBox.classList.remove("show");
  setupSilenceDetection();
  // hard cap 8s so it can never run away
  setTimeout(() => { if (recording) stopRec(); }, 8000);
}

function setupSilenceDetection(){
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);
    const data = new Uint8Array(analyser.fftSize);
    let spokeYet = false;
    const check = () => {
      if (!recording) return;
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum += v*v; }
      const rms = Math.sqrt(sum/data.length);
      if (rms > 0.035) {          // speaking
        spokeYet = true;
        if (silenceTimer){ clearTimeout(silenceTimer); silenceTimer = null; }
      } else if (spokeYet && !silenceTimer) {   // went quiet AFTER speaking
        silenceTimer = setTimeout(() => { if (recording) stopRec(); }, 1000); // 1s pause = done
      }
      requestAnimationFrame(check);
    };
    check();
  } catch(e){ /* silence detection optional; hard cap still applies */ }
}

function stopRec(){
  if (!recording) return;
  recording = false;
  micBtn.classList.remove("rec");
  micBtn.textContent = "🎙️";
  hint.textContent = "Transcribing…";
  try { mediaRecorder.stop(); } catch(e){}
  if (silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; }
  if (audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx=null; }
  if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
}

async function onStop(){
  const blob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
  if (blob.size < 800){ hint.textContent = "Didn't catch that — tap and speak again."; return; }
  const b64 = await blobToB64(blob);
  const ep = epInput.value.trim();
  const t0 = performance.now();
  try {
    const r = await fetch(ep, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        audio: b64,
        encoding: (blob.type.includes("mp4") ? "MP4" : "WEBM_OPUS"),
        sampleRateHertz: 48000,
        lang: "ta-IN"
      })
    });
    const ms = Math.round(performance.now()-t0);
    const data = await r.json();
    if (!r.ok){
      transcriptEl.innerHTML = '<span class="err">'+(data.error||("HTTP "+r.status))+'</span>';
      altsEl.innerHTML = "";
      log("Server said: " + JSON.stringify(data.detail || data, null, 1).slice(0,800));
      resultBox.classList.add("show");
      hint.textContent = "Tap to try again";
      return;
    }
    transcriptEl.textContent = data.transcript || "(nothing recognised)";
    const alts = (data.alternatives||[]).slice(1);
    altsEl.innerHTML = alts.length
      ? '<div class="rlabel">Other guesses</div>' + alts.map((a,i)=>`<div class="a"><span class="n">${i+2}.</span>${a}</div>`).join("")
      : "";
    timingEl.textContent = `round-trip ${ms} ms · clip ${(blob.size/1024).toFixed(0)} KB · ${blob.type}`;
    resultBox.classList.add("show");
    hint.textContent = "Tap to speak again";
    log("");
  } catch(e){
    hint.textContent = "Network error — tap to retry.";
    log("Fetch failed: " + e);
  }
}

function blobToB64(blob){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(String(r.result).split(",")[1]);   // strip data: prefix
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

micBtn.addEventListener("click", ()=> recording ? stopRec() : startRec());
</script>
</body>
</html>
